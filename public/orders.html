<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>My orders | Rayzex.Zone</title></head><body><main><h1>My orders</h1><p id="ok" class="tag big"></p><div id="l"></div></main><script src="/app.js"></script><script>
const pl=new URLSearchParams(location.search).get('placed');if(pl)$('#ok').textContent='Order #'+(+pl)+' placed. Thank you!';
authed().then(()=>api('/orders')).then(d=>{$('#l').innerHTML=d.map(o=>`<div class="panel"><b>Order #${o.id}</b> <span class="tag">${esc(o.status)}</span><br>${o.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')}<br><span class="mut">${esc(o.address)}</span><br><b>${inr(o.total)}</b></div>`).join('')||'<p>No orders yet. <a href="/shop.html">Start shopping</a></p>'}).catch(e=>toast(e.message));
</script></body></html>
