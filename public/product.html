<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Product | Rayzex.Zone</title></head><body><main><a href="/shop.html">Back to shop</a><div class="two" id="d" style="margin-top:20px"></div></main><script src="/app.js"></script><script>
pub('/products/'+new URLSearchParams(location.search).get('id')).then(p=>{if(p.error)throw 0;document.title=p.name+' | Rayzex.Zone';
$('#d').innerHTML=`<div class="pic big">${p.emoji}</div><div><h1>${esc(p.name)}</h1><p class="tag">${esc(p.category)}</p><p class="big"><b style="color:var(--gold)">${inr(p.price)}</b> <s class="mut">${inr(p.mrp)}</s> <span class="tag">${Math.round(100-p.price/p.mrp*100)}% off</span></p><p class="mut">${p.stock>0?p.stock+' in stock':'Sold out'}</p><button class="btn" ${p.stock<1?'disabled':''} onclick="addToCart(${p.id}).catch(e=>toast(e.message))">Add to cart</button></div>`}).catch(()=>$('#d').textContent='Product not found.');
</script></body></html>
