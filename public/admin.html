<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Admin | Rayzex.Zone</title></head><body><main><h1>All orders</h1><div id="l">Loading...</div></main><script src="/app.js"></script><script>
const S=['placed','shipped','delivered','cancelled'],st=(id,s)=>api('/admin/orders/'+id,{method:'PATCH',body:{status:s}}).then(()=>toast('Status updated')).catch(e=>toast(e.message));
authed().then(()=>api('/admin/orders')).then(d=>{$('#l').innerHTML=d.map(o=>`<div class="panel"><b>#${o.id}</b> ${esc(o.name)}, ${esc(o.phone)}, ${inr(o.total)}<br>${esc(o.address)}<br><span class="mut">${o.items.map(i=>esc(i.name)+' x'+i.qty).join(', ')}</span><br><select onchange="st(${o.id},this.value)">${S.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'No orders yet.'})
.catch(e=>$('#l').textContent=e.status==403?'This account is not an admin. Add your sign-in email to ADMIN_EMAILS in .env, then restart the server.':e.message);
</script></body></html>
