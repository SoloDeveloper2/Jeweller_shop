<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Delivery address | Rayzex.Zone</title></head><body><main><h1>Delivery address</h1><div class="two"><form id="f"><input name="name" placeholder="Full name" required><input name="phone" placeholder="10-digit phone number" pattern="\d{10}" required><textarea name="address" rows="4" placeholder="House no, street, city, state, pincode" required></textarea><button class="btn">Place order (pay on delivery)</button></form><div id="sum"></div></div></main><script src="/app.js"></script><script>
authed().then(async()=>{const c=await api('/cart');if(!c.length)return location.href='/cart.html';const sub=c.reduce((s,i)=>s+i.price*i.qty,0),ship=sub<599?60:0;
document.querySelector('[name=name]').value=Clerk.user.fullName||'';
$('#sum').innerHTML='<div class="panel">'+c.map(i=>`<div class="row"><span>${i.emoji} ${esc(i.name)} x${i.qty}</span><span>${inr(i.price*i.qty)}</span></div>`).join('')+`<div class="row"><span>Shipping</span><span>${ship?inr(ship):'Free'}</span></div><div class="row"><b>Total</b><b>${inr(sub+ship)}</b></div></div>`});
$('#f').onsubmit=async e=>{e.preventDefault();try{const d=await api('/orders',{method:'POST',body:Object.fromEntries(new FormData(e.target))});location.href='/orders.html?placed='+d.order.id}catch(x){toast(x.message)}};
</script></body></html>
